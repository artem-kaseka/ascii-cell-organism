<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOMATYPE // 01 — Interactive ASCII Cell Organism</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050809;
      color: #cfece2;
      font-family: 'Liberation Mono', 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Interactive ASCII Cell Organism"></canvas>
  <script src="./organism.js"></script>
</body>
</html>
